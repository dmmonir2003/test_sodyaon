const tabs = {full:'Full Schema',category:'Category + Filters',product:'Product + Variants',commerce:'Orders + Deals',content:'Reviews + Q&A + Videos',user:'Users + Combos + AI'};

window.show = async function(key) {
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim() === tabs[key]);
  });
  await render(key);
};

async function render(key) {
  const c = document.getElementById('erd-container');
  c.innerHTML = '<div style="color:var(--color-text-tertiary);font-size:12px;padding:24px 0">Rendering diagram…</div>';
  try {
    const id = 'erd-' + key + '-' + Date.now();
    const { svg } = await mermaid.render(id, diagrams[key]);
    c.innerHTML = svg;
    c.querySelectorAll('.node').forEach(node => {
      const fp = node.querySelector('path[d]');
      if (!fp) return;
      const nums = fp.getAttribute('d').match(/-?[\d.]+/g)?.map(Number);
      if (!nums || nums.length < 8) return;
      const xs = [nums[0],nums[2],nums[4],nums[6]], ys = [nums[1],nums[3],nums[5],nums[7]];
      const x=Math.min(...xs),y=Math.min(...ys),w=Math.max(...xs)-x,h=Math.max(...ys)-y;
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);r.setAttribute('rx','8');
      for(const a of['fill','stroke','stroke-width','class','style'])if(fp.hasAttribute(a))r.setAttribute(a,fp.getAttribute(a));
      fp.replaceWith(r);
    });
    c.querySelectorAll('.row-rect-odd path,.row-rect-even path').forEach(p=>p.setAttribute('stroke','none'));
  } catch(e) {
    c.innerHTML = '<div style="color:var(--color-text-danger);font-size:12px;padding:12px">Render error: '+e.message+'</div>';
  }
}
