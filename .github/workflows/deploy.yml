name: Production Deployment CI/CD

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Production Code
        uses: actions/checkout@v4

      - name: SSH & Deploy to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.52.115.218
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            # 1. Environment & PATH setup
            if [ -d "$HOME/.nvm" ]; then
              export NVM_DIR="$HOME/.nvm"
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            fi
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
            export NEXT_TELEMETRY_DISABLED=1

            # 2. Ensure VPS has swap memory enabled to prevent build OOM crashes
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=2048 2>/dev/null
              chmod 600 /swapfile 2>/dev/null || true
              mkswap /swapfile 2>/dev/null || true
              swapon /swapfile 2>/dev/null || true
            else
              swapon /swapfile 2>/dev/null || true
            fi

            echo "=== 1. Pulling Latest Production Code ==="
            cd /var/www/sodayon
            git fetch origin production
            git reset --hard origin/production

            echo "=== 2. Configuring Backend Environment ==="
            cd /var/www/sodayon/backend
            touch .env
            grep -q "EMAIL_USER=" .env || echo "EMAIL_USER=sodayonbd@gmail.com" >> .env
            sed -i 's/EMAIL_USER=.*/EMAIL_USER=sodayonbd@gmail.com/' .env
            grep -q "EMAIL_PASS=" .env || echo 'EMAIL_PASS="ueyd setk eayo ugjg"' >> .env
            sed -i 's/EMAIL_PASS=.*/EMAIL_PASS="ueyd setk eayo ugjg"/' .env
            grep -q "EMAIL_HOST=" .env || echo "EMAIL_HOST=smtp.gmail.com" >> .env
            sed -i 's/EMAIL_HOST=.*/EMAIL_HOST=smtp.gmail.com/' .env
            grep -q "EMAIL_PORT=" .env || echo "EMAIL_PORT=587" >> .env
            sed -i 's/EMAIL_PORT=.*/EMAIL_PORT=587/' .env
            grep -q "EMAIL_FROM=" .env || echo 'EMAIL_FROM="সদায়ন <sodayonbd@gmail.com>"' >> .env
            sed -i 's/EMAIL_FROM=.*/EMAIL_FROM="সদায়ন <sodayonbd@gmail.com>"/' .env
            grep -q "CLOUDINARY_CLOUD_NAME=" .env || echo "CLOUDINARY_CLOUD_NAME=ub7sbihp" >> .env
            sed -i 's/CLOUDINARY_CLOUD_NAME=.*/CLOUDINARY_CLOUD_NAME=ub7sbihp/' .env
            grep -q "CLOUDINARY_API_KEY=" .env || echo "CLOUDINARY_API_KEY=233439717885269" >> .env
            sed -i 's/CLOUDINARY_API_KEY=.*/CLOUDINARY_API_KEY=233439717885269/' .env
            grep -q "CLOUDINARY_API_SECRET=" .env || echo "CLOUDINARY_API_SECRET=TOa4JkGry55jHsljKLqKCDtRSNc" >> .env
            sed -i 's/CLOUDINARY_API_SECRET=.*/CLOUDINARY_API_SECRET=TOa4JkGry55jHsljKLqKCDtRSNc/' .env

            echo "=== 3. Building Backend & Reloading API Server ==="
            npm install --no-audit --no-fund
            npm run build
            pm2 reload all || pm2 restart all || true

            echo "=== 4. Building Frontend Application ==="
            cd /var/www/sodayon/frontend
            touch .env.local
            npm install --no-audit --no-fund
            NODE_OPTIONS="--max-old-space-size=2048" npm run build

            echo "=== 5. Finalizing PM2 Process Reload ==="
            pm2 reload all || pm2 restart all || true
            pm2 save || true
            echo "=== 6. Production Deployment Completed Successfully ==="
